name: Azure Container Apps Cloud Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'production'
      image_tag:
        description: 'Container image tag'
        required: true
        default: 'v1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC Workload Identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Azure CLI & Extensions
        run: |
          az extension add --name containerapp --upgrade

      - name: Deploy Infrastructure via Bicep Template
        run: |
          az group create --name rg-lungcancer-prod --location eastus
          az deployment group create \
            --resource-group rg-lungcancer-prod \
            --template-file deploy/azure/azure-container-apps.bicep \
            --parameters imageTag=${{ github.event.inputs.image_tag }}
